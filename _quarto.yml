project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "posts/**/*.qmd"

# Meta
description-meta: "Lingwei's Homepage"
author-meta: "Lingwei Zheng"

website:
  title: "Sensing Urban Dynamics"
  favicon: "files/profiles/favicon.ico"
  description: "Lingwei's Homepage"

  navbar:
    background: light

    left:
      - text: Publications
        href: publications.qmd
      - text: Presentations
        href: presentation.qmd
      - text: Teaching & Services
        href: teaching.qmd
      - text: Contact
        href: contact.qmd 

    right: 
      - text: CV
        href: files/Lingwei_s_Resume.pdf
      - icon: github
        href: https://github.com/lingwei-zheng
        target: _blank
      - text: "{{< fa brands x-twitter >}}"
        href: https://x.com/LingweiZheng
        target: _blank
  
  page-navigation: true
  
  page-footer: 
    left: "[Lingwei Zheng](https://lingwei-zheng.github.io) &copy; <script>document.write(new Date().getFullYear())</script>" 
    center: "Build on [Quart Academic Website Template](https://github.com/drganghe/quarto-academic-website-template)"
    right:  
      - icon: github
        href: https://github.com/lingwei-zheng
        target: _blank
  
  search:
    location: navbar
    type: textbox
  
  reader-mode: true

  draft-mode: unlinked
  
  repo-url: https://github.com/lingwei-zheng/lingwei-zheng.github.io
  
  open-graph: true
  
  twitter-card: true 
  
  site-url: "https://lingwei-zheng.github.io"
  
  google-analytics:
    tracking-id: "G-14EQZPM1N7"
    anonymize-ip: true 

bibliography: references.bib

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    link-external-filter: '^(?:http:|https:)\/\/drganghe\.github\.io\/custom'
    include-in-header: "files/includes/_academic.qmd"

